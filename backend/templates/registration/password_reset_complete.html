<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8">
  <title>رمز عبور با موفقیت تغییر کرد</title>
  <style>
    @import url('https://cdn.jsdelivr.net/gh/rastikerdar/vazir-font@v30.1.0/dist/font-face.css');

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: Vazir, Tahoma, sans-serif;
      background: linear-gradient(135deg, #74ebd5 0%, #ACB6E5 100%);
    }

    body {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding-top: 120px; /* باکس رو کمی بالا میاره */
    }

    .message-container {
      background-color: #fff;
      padding: 35px 40px;
      border-radius: 15px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
      max-width: 420px;
      width: 100%;
      direction: rtl;
      text-align: center;
      animation: floatUp 0.4s ease-out;
    }

    @keyframes floatUp {
      from {
        transform: translateY(30px);
        opacity: 0;
      }
      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    h2 {
      color: #333;
      margin-bottom: 18px;
      font-weight: 700;
      font-size: 1.6rem;
    }

    p {
      color: #555;
      font-size: 1.1rem;
      line-height: 1.5;
      margin-bottom: 28px;
    }

    a {
      display: inline-block;
      padding: 12px 25px;
      background-color: #3498db;
      color: white;
      border-radius: 10px;
      text-decoration: none;
      font-weight: 600;
      font-size: 1rem;
      box-shadow: 0 4px 15px rgba(52, 152, 219, 0.4);
      transition: background-color 0.3s ease, box-shadow 0.3s ease;
    }

    a:hover {
      background-color: #2980b9;
      box-shadow: 0 6px 20px rgba(41, 128, 185, 0.6);
    }

    @media (max-height: 500px) {
      body {
        align-items: flex-start;
        padding: 40px 20px;
      }
    }
  </style>
</head>
<body>
  <div class="message-container">
    <h2>رمز عبور با موفقیت تغییر کرد</h2>
    <p>رمز عبور جدید شما با موفقیت ثبت شد. اکنون می‌توانید وارد حساب خود شوید.</p>
    <a href="http://localhost:5173/login">بازگشت به صفحه ورود</a>
  </div>
</body>
</html>
