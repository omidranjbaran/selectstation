<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8" />
  <title>ایمیل بازیابی ارسال شد</title>
  <style>
    @import url('https://cdn.jsdelivr.net/gh/rastikerdar/vazir-font@v30.1.0/dist/font-face.css');

    body {
      font-family: Vazir, Tahoma, sans-serif;
      background: linear-gradient(135deg, #74ebd5 0%, #ACB6E5 100%);
      height: 100vh;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 0 20px;
    }

    .message-container {
      background-color: white;
      padding: 35px 40px;
      border-radius: 15px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
      max-width: 400px;
      width: 100%;
      direction: rtl;
      text-align: center;
      transition: transform 0.3s ease;
      margin-top: 90px;  /* همینجا باکسو یه کوچولو پایین آوردیم */
    }

    .message-container:hover {
      transform: translateY(-5px);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.2);
    }

    h2 {
      color: #333;
      margin-bottom: 18px;
      font-weight: 700;
      font-size: 1.6rem;
    }

    p {
      color: #555;
      font-size: 1.1rem;
      line-height: 1.5;
      margin-bottom: 28px;
    }

    a {
      display: inline-block;
      padding: 12px 25px;
      background-color: #3498db;
      color: white;
      border-radius: 10px;
      text-decoration: none;
      font-weight: 600;
      font-size: 1rem;
      box-shadow: 0 4px 15px rgba(52, 152, 219, 0.4);
      transition: background-color 0.3s ease, box-shadow 0.3s ease;
    }

    a:hover {
      background-color: #2980b9;
      box-shadow: 0 6px 20px rgba(41, 128, 185, 0.6);
    }
  </style>
</head>
<body>
  <div class="message-container">
    <h2>ایمیل بازیابی رمز عبور ارسال شد</h2>
    <p>لطفاً ایمیل خود را چک کنید و روی لینک بازیابی کلیک کنید.</p>
    <a href="http://localhost:5173/login">بازگشت به صفحه ورود</a>
  </div>
</body>
</html>
