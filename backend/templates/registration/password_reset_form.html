<!DOCTYPE html>
<html lang="fa">
  <head>
    <meta charset="UTF-8" />
    <title>بازیابی رمز عبور</title>
    <style>
      @import url("https://cdn.jsdelivr.net/gh/rastikerdar/vazir-font@v30.1.0/dist/font-face.css");

      body {
        font-family: Vazir, Tahoma, sans-serif;
        background: linear-gradient(135deg, #74ebd5 0%, #acb6e5 100%);
        height: 100vh;
        margin: 0;
        padding: 40px 20px;
        display: flex;
        justify-content: center;
        align-items: flex-start; /* تغییر اصلی: فرم به بالا متمایل می‌شود */
        padding-top: 80px; /* فاصله از بالا */
      }

      .form-container {
        background-color: white;
        padding: 35px 40px;
        border-radius: 15px;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
        max-width: 400px;
        width: 100%;
        direction: rtl;
        text-align: center;
        transition: transform 0.3s ease;
        margin-top: 40px; /* فرم کمی پایین‌تر از بالا قرار بگیرد */
      }

      .form-container:hover {
        transform: translateY(-5px);
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.2);
      }

      h2 {
        margin-bottom: 15px;
        color: #333;
        font-weight: 700;
        font-size: 1.6rem;
      }

      p {
        color: #555;
        font-size: 1.1rem;
        margin-bottom: 25px;
        line-height: 1.5;
      }

      form {
        display: flex;
        flex-direction: column;
      }

      label {
        text-align: right;
        margin-bottom: 5px;
        font-weight: 600;
        color: #555;
        font-size: 14px;
      }

      input[type="email"] {
        padding: 12px;
        border: 1px solid #ccc;
        border-radius: 10px;
        margin-bottom: 20px;
        font-size: 15px;
        transition: border-color 0.3s ease;
      }

      input[type="email"]:focus {
        border-color: #3498db;
        outline: none;
        box-shadow: 0 0 8px rgba(52, 152, 219, 0.5);
      }

      button {
        padding: 12px;
        background-color: #3498db;
        color: white;
        border: none;
        border-radius: 12px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: background-color 0.3s ease, box-shadow 0.3s ease;
      }

      button:hover {
        background-color: #2980b9;
        box-shadow: 0 6px 20px rgba(41, 128, 185, 0.6);
      }
    </style>
  </head>
  <body>
    <div class="form-container">
      <h2>بازیابی رمز عبور</h2>
      <p>ایمیل خود را وارد کنید تا لینک بازیابی برایتان ارسال شود.</p>

      <form method="post">
        {% csrf_token %}
        <label for="{{ form.email.id_for_label }}">ایمیل:</label> {{ form.email }}
        <button type="submit">ارسال لینک بازیابی</button>
      </form>
    </div>
  </body>
</html>
